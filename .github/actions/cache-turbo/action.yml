name: Cache Turbo tasks
description: Reuse content-addressed build results across CI runs.
inputs:
  scope:
    description: Distinguishes jobs that save different sets of tasks.
    required: true
  path:
    description: Turbo cache directory.
    default: .turbo/cache
runs:
  using: composite
  steps:
    - id: runtime
      shell: bash
      run: echo "node=$(node -p process.versions.node)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ inputs.path }}
        key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ inputs.scope }}-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ inputs.scope }}-
          turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-
