name: Pack Better Auth UI
description: Build the pinned companion source for coordinated release consumers.
outputs:
  tarball:
    description: Absolute path to the packed companion.
    value: ${{ steps.pack.outputs.tarball }}
runs:
  using: composite
  steps:
    - name: Checkout Better Auth UI
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: better-stack-ai/better-auth-ui
        ref: 29e8dd41b50f1382f968078630aa00f15137a8ab # 3.0.0 companion candidate
        path: .packed-consumer/better-auth-ui
    - name: Install and build Better Auth UI
      shell: bash
      working-directory: .packed-consumer/better-auth-ui
      run: |
        corepack pnpm@10.26.2 install --ignore-workspace --frozen-lockfile
        corepack pnpm@10.26.2 build
    - name: Pack Better Auth UI
      id: pack
      shell: bash
      working-directory: .packed-consumer/better-auth-ui
      run: |
        mkdir -p "$RUNNER_TEMP/better-auth-ui"
        tarball="$(npm pack --quiet --pack-destination "$RUNNER_TEMP/better-auth-ui")"
        echo "tarball=$RUNNER_TEMP/better-auth-ui/$tarball" >> "$GITHUB_OUTPUT"
