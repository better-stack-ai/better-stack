name: Pack Better Auth UI
description: Build the pinned companion source for coordinated release consumers.
outputs:
  tarball:
    description: Absolute path to the packed companion.
    value: ${{ steps.pack.outputs.tarball }}
runs:
  using: composite
  steps:
    - name: Checkout Better Auth UI
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: better-stack-ai/better-auth-ui
        ref: cdb0a0fa773ad4f90a67848d97558582e7ab7486 # Companion 3.0.3-beta.0; Core v4/v5/v6 compatibility
        path: .packed-consumer/better-auth-ui
    - name: Install and build Better Auth UI
      shell: bash
      working-directory: .packed-consumer/better-auth-ui
      run: |
        corepack pnpm@10.26.2 install --ignore-workspace --frozen-lockfile
        corepack pnpm@10.26.2 build
    - name: Pack Better Auth UI
      id: pack
      shell: bash
      working-directory: .packed-consumer/better-auth-ui
      run: |
        mkdir -p "$RUNNER_TEMP/better-auth-ui"
        node "$GITHUB_WORKSPACE/scripts/pack-candidate.mjs" --package-dir "$PWD" --destination "$RUNNER_TEMP/better-auth-ui" --sha cdb0a0fa773ad4f90a67848d97558582e7ab7486 > "$RUNNER_TEMP/better-auth-ui/receipt.json"
        tarball="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).path" "$RUNNER_TEMP/better-auth-ui/receipt.json")"
        echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
