name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release gate rejection states
        run: node --test scripts/pack-candidate.test.mjs scripts/release-gate/*.test.mjs

      - name: Test benchmark report validation
        run: node --test scripts/benchmarks/rendering.test.mjs

      - name: Test product proof fixtures
        run: pnpm test:product-proof

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Lint
        run: pnpm -w lint

      - name: Build
        run: pnpm -w build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Knip
        run: pnpm --filter @btst/stack run knip --reporter github-actions

      - name: Test
        run: pnpm -w test

