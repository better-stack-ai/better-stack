name: Packed consumers

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: packed-consumers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare consumer archives
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo tasks
        uses: ./.github/actions/cache-turbo
        with:
          scope: packed-consumers

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test harness
        run: pnpm test:packed-consumers

      - name: Build workspace packages once
        run: pnpm build

      - name: Pack candidate archives
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/packed-consumer/ci.mjs prepare "$RUNNER_TEMP/consumer-archives/packages" "$CANDIDATE_SHA"

      - name: Pack pinned Better Auth UI once
        id: pack-auth-ui
        uses: ./.github/actions/pack-auth-ui

      - name: Stage companion archive
        env:
          AUTH_TARBALL: ${{ steps.pack-auth-ui.outputs.tarball }}
        run: cp "$AUTH_TARBALL" "$RUNNER_TEMP/consumer-archives/better-auth-ui.tgz"

      - name: Share candidate archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-archives
          path: ${{ runner.temp }}/consumer-archives
          if-no-files-found: error

  consumers:
    name: Consumers ${{ matrix.shard }} (${{ matrix.package-manager }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download candidate archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: consumer-archives
          path: ${{ runner.temp }}/consumer-archives

      - name: Install Chromium for package rendering checks
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Validate consumers
        env:
          SHARD: ${{ matrix.shard }}
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/packed-consumer/ci.mjs shard "$SHARD" "$PACKAGE_MANAGER"
          "$RUNNER_TEMP/consumer-archives/packages"
          "$RUNNER_TEMP/consumer-archives/better-auth-ui.tgz"
          "$CANDIDATE_SHA" "$RUNNER_TEMP/packed-reports"

      - name: Save per-fixture measurements and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packed-${{ matrix.shard }}-${{ matrix.package-manager }}
          path: ${{ runner.temp }}/packed-reports
