name: Packed consumers

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]


concurrency:
  group: packed-consumers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.fixture }} (${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
        fixture: ["core","affiliate","ai-chat","analytics","blog","blog-newsletter","calendar","cms","comments","components","crm","ecommerce","feature-flags","feedback","form-builder","helpdesk","job-board","kanban","media","media-s3","media-vercel-blob","newsletter","open-api","route-docs","school","ui-builder"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test harness
        run: pnpm test:packed-consumers

      - name: Install Chromium for package rendering checks
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Pack and validate selected consumer
        run: >-
          pnpm smoke:packed-consumer --
          --fixture ${{ matrix.fixture }}
          --package-manager ${{ matrix.package-manager }}
          --sha ${{ github.event.pull_request.head.sha || github.sha }}
          --report packed-report.json

      - name: Save packed consumer measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-${{ matrix.fixture }}-${{ matrix.package-manager }}
          path: packed-report.json

  auth:
    name: Auth + account (${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]

    steps:
      - name: Checkout Better Stack
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Better Stack workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack pinned Better Auth UI
        id: pack-auth-ui
        uses: ./.github/actions/pack-auth-ui

      - name: Test harness
        run: pnpm test:packed-consumers

      - name: Pack and validate auth consumer
        run: >-
          pnpm smoke:packed-consumer --
          --fixture auth
          --package-manager ${{ matrix.package-manager }}
          --better-auth-ui ${{ steps.pack-auth-ui.outputs.tarball }}
          --sha ${{ github.event.pull_request.head.sha || github.sha }}
          --report packed-report.json

      - name: Save Auth consumer measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-auth-${{ matrix.package-manager }}
          path: packed-report.json
