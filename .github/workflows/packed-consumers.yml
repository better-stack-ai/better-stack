name: Packed consumers

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/stack/**'
      - 'scripts/packed-consumer/**'
      - 'scripts/packed-consumer-smoke.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/packed-consumers.yml'

concurrency:
  group: packed-consumers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test harness
        run: pnpm test:packed-consumers

      - name: Pack and validate core consumer
        run: >-
          pnpm smoke:packed-consumer --
          --fixture core
          --package-manager ${{ matrix.package-manager }}
