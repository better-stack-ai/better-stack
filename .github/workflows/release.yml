name: BTST Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing package@version Git tag; select that same tag as the workflow ref
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  deployments: read

concurrency:
  group: btst-publication
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Validate selected package and committed source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release-gate/packages.mjs > release-metadata.json
      - name: Verify exact release commit CI and deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate/gate.mjs --output release-gate-initial.json
      - name: Save gate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-gate-initial
          path: release-gate-initial.json

  release:
    needs: gate
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      deployments: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.17.0
      - name: Select one package and its channel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node scripts/release-gate/packages.mjs > release-metadata.json
          node --input-type=module - <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const release = JSON.parse(readFileSync('release-metadata.json'));
          appendFileSync(process.env.GITHUB_ENV, `PKG_NAME=${release.name}\nPKG_VERSION=${release.version}\nPKG_DIR=${release.path.slice(0, -'/package.json'.length)}\nNPM_DIST_TAG=${release.distTag}\nCANDIDATE_SHA=${release.sha}\n`);
          JS
      - run: pnpm install --frozen-lockfile
      - name: Verify release tooling
        run: node --test scripts/pack-candidate.test.mjs scripts/release-gate/*.test.mjs
      - name: Build and typecheck candidate packages
        run: pnpm typecheck
      - name: Pack the selected normalized candidate
        run: node scripts/pack-candidate.mjs --package-dir "$PKG_DIR" --destination "$RUNNER_TEMP/release" --sha "$CANDIDATE_SHA" > release-artifact.json
      - name: Refresh source, CI and deployment gate immediately before publication
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node scripts/release-gate/packages.mjs > release-metadata.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const release = JSON.parse(readFileSync('release-metadata.json'));
          const artifact = JSON.parse(readFileSync('release-artifact.json'));
          assert.equal(artifact.name, release.name);
          assert.equal(artifact.version, release.version);
          assert.equal(artifact.gitHead, release.sha);
          JS
          node scripts/release-gate/gate.mjs --publishing "$PKG_NAME" --dist-tag "$NPM_DIST_TAG" --output release-gate-publish.json
          node --input-type=module - <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const receipt = JSON.parse(readFileSync('release-gate-publish.json'));
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${receipt.publication[0].outcome !== 'already-published'}\n`);
          JS
      - name: Publish selected artifact with trusted publishing
        if: steps.preflight.outputs.publish == 'true'
        run: |
          artifact=$(node -p "JSON.parse(require('fs').readFileSync('release-artifact.json')).path")
          npm publish "$artifact" --access public --provenance --tag "$NPM_DIST_TAG"
      - name: Verify selected publication and retained stable channel
        run: node scripts/release-gate/verify-publication.mjs release-metadata.json release-artifact.json release-gate-publish.json release-publication.json
      - name: Save publication receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-publication
          path: |
            release-metadata.json
            release-artifact.json
            release-gate-*.json
            release-publication.json
      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-debug-logs
          path: /home/runner/.npm/_logs/
          retention-days: 7
