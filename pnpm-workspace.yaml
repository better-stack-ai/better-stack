packages:
  - packages/**
  - docs
  - playground
  - e2e
  - codegen-projects/*

catalog:
  '@better-fetch/fetch': ^1.3.3
  better-call: 1.4.4
  tsx: ^4.21.0
  typescript: ^5.6.3
  unbuild: 3.6.1
  vitest: ^4.1.12

catalogs:
  react18:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: 19.3.1
    react-dom: 19.3.1

neverBuiltDependencies: []

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

overrides:
  esbuild@<=0.24.2: '>=0.25.0'
  miniflare>zod: ^3.25.1
  vinxi>zod: ^3.24.3
  react: 19.3.1
  react-dom: 19.3.1
  '@tanstack/react-query': 5.105.0
  '@tanstack/query-core': 5.105.0
  sonner: ^2.0.7
  # GHSA-rj75-hqrm-r3gf: retain the typography plugin’s parser major.
  '@tailwindcss/typography>postcss-selector-parser': 6.1.5
  # Match the exact peers of the coordinated DB/adapter release.
  better-auth: 1.7.14
  '@better-auth/core': 1.7.14
  '@better-auth/utils': 0.5.1
  # Exact pin: zod brands its minor version into its types ($ZodType _zod.version),
  # so two coexisting 4.x resolutions (e.g. 4.2.x and 4.4.x) fail to typecheck
  # against each other in fresh codegen-project installs.
  zod: 4.6.7
