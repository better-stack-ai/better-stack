packages:
  - packages/**
  - docs
  - playground
  - e2e
  - codegen-projects/*

catalog:
  '@better-fetch/fetch': 1.3.2
  better-call: 1.4.0
  tsx: ^4.21.0
  typescript: ^5.6.3
  unbuild: 3.6.1
  vitest: ^3.2.4

catalogs:
  react18:
    '@types/react': ^19.1.12
    '@types/react-dom': ^19.1.9
    react: 19.2.7
    react-dom: 19.2.7

neverBuiltDependencies: []

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

overrides:
  esbuild@<=0.24.2: '>=0.25.0'
  miniflare>zod: ^3.25.1
  # Keep TanStack Start on the security-patched toolchain (see setup-tanstack.sh).
  # Its build plugins require a newer Zod than the library-wide pin.
  '@tanstack/react-start': 1.168.60
  '@tanstack/router-generator>zod': 4.5.4
  '@tanstack/router-plugin>zod': 4.5.4
  '@tanstack/start-plugin-core>zod': 4.5.4
  # Exact pin: zod brands its minor version into its types ($ZodType _zod.version),
  # so two coexisting 4.x resolutions (e.g. 4.2.x and 4.4.x) fail to typecheck
  # against each other in fresh codegen-project installs.
  zod: 4.4.3
